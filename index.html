    c.className = "catch-card catch-" + kind;
    c.innerHTML = '<div class="catch-pic">' + svg + '</div><div class="catch-text"><b>' + withRuby(title) + "</b><span>" + withRuby(line) + "</span></div>";
    fishEl("fish-pond").appendChild(c);
  }
  function dismissCatch() {
    if (fishPhase !== "catch") return;
    clearFishTimers();
    var c = fishEl("catch-card");
    var wasBox = c && c.classList.contains("catch-box");
    if (c) c.remove();
    if (wasBox) { setFishPhase("done"); showFishStars(); return; }
    setFishPhase("idle");
    if (targetsDone() && !fishBoxMode) { startBoxMode(); return; }
    if (fishBoxMode) setFishTip("把鱼钩放到亮光旁边。");
    else setFishTip("点一点水面，再放鱼钩。");
  }

  function startBoxMode() {
    fishBoxMode = true;
    var b = pondBounds();
    var el = document.createElement("div");
    el.className = "pond-sparkle";
    el.innerHTML = "<i></i><i></i><i></i><i></i>";
    fishEl("fish-pond").insertBefore(el, fishEl("fish-layer").nextSibling);
    fishSparkle = { el: el, x: fishW * 0.42, y: b.t + (b.b - b.t) * 0.45 };
    placeSparkle();
    var msg = "鱼钓够啦！水里有亮光，把鱼钩放到亮光旁边。";
    setFishTip(msg);
    toast("水里有亮光！");
    speak("水里有亮光！把鱼钩放到亮光旁边。");
    cheer("快看，亮亮的！");
  }
  function placeSparkle() {
    var b = pondBounds();
    fishSparkle.x = Math.max(b.l + 30, Math.min(b.r - 30, fishSparkle.x));
    fishSparkle.y = Math.max(b.t + 10, Math.min(b.b - 10, fishSparkle.y));
    fishSparkle.el.style.left = fishSparkle.x + "px";
    fishSparkle.el.style.top = fishSparkle.y + "px";
  }

  function fishStarCount() {
    var n = fishMisses <= 2 ? 3 : fishMisses <= 5 ? 2 : 1;
    if (fishBonus) n++;
    return Math.min(3, n);
  }
  function fishBestStars() {
    try { return parseInt(localStorage.getItem(FISH_STARS_KEY), 10) || 0; } catch (e) { return 0; }
  }
  function fishStarsHtml(n) {
    var h = "";
    for (var i = 1; i <= 3; i++) h += '<span class="fs-star' + (i <= n ? " on" : "") + '">★</span>';
    return h;
  }
  function renderFishHud() {
    var hud = fishEl("fish-hud");
    if (!hud) return;
    var html = "";
    FISH_TARGET_ORDER.forEach(function (k) {
      var got = Math.min(fishCaught[k] || 0, FISH_TARGETS[k]);
      var done = got >= FISH_TARGETS[k];
      html += '<span class="fs-chip fs-' + k + (done ? " done" : "") + '"><i class="fs-ico">' + fishSvg(k) + "</i>" + withRuby(FISH_KINDS[k].name) + " " + got + " / " + FISH_TARGETS[k] + (done ? " ✓" : "") + "</span>";
    });
    if (fishBonus) html += '<span class="fs-chip fs-star-fish done"><i class="fs-ico">' + fishSvg("star") + "</i>金色大" + withRuby("鲤鱼") + " ✓</span>";
    var best = fishBestStars();
    html += '<span class="fs-chip fs-stars">' + fishStarsHtml(fishStarCount()) + (best ? "<small>最好 " + best + " 星</small>" : "") + "</span>";
    hud.innerHTML = html;
  }

  function clearHintRing() {
    if (fishRing) { clearTimeout(fishRing.timer); fishRing.el.remove(); }
    fishRing = null;
    var bar = fishEl("reel-bar");
    if (bar) bar.classList.remove("hinted");
  }
  function placeRing(x, y) {
    if (!fishRing) return;
    fishRing.el.style.left = x + "px";
    fishRing.el.style.top = y + "px";
  }
  function ringAt(x, y, follow) {
    clearHintRing();
    var el = document.createElement("div");
    el.className = "fish-hint-ring";
    fishEl("fish-pond").appendChild(el);
    fishRing = { el: el, follow: follow || null };
    placeRing(x, y);
    fishRing.timer = setTimeout(clearHintRing, 3800);
  }
  function showFishHint() {
    if (!fishActive()) return;
    var say = "";
    if (fishPhase === "idle" || (fishBoxMode && fishPhase === "wait")) {
      if (fishBoxMode) {
        ringAt(fishSparkle.x, fishSparkle.y);
        say = "把鱼钩放到亮光旁边。";
      } else {
        var need = fishList.filter(function (o) { return o.state === "swim" && needKind(o.kind); });
        var o = need[0] || fishList[0];
        if (o) ringAt(o.x, o.y, o);
        say = o && needKind(o.kind) ? "点一点" + FISH_KINDS[o.kind].name + "旁边的水面，放下鱼钩。" : "点一点水面，放下鱼钩。";
      }
    } else if (fishPhase === "wait" || fishPhase === "come") {
      if (fishPhase === "wait") { clearFishTimers(); chooseBiter(); }
      if (fishBiter && fishBiter.kind) { fishBiter.boost = 1.8; ringAt(fishBiter.x, fishBiter.y, fishBiter); }
      else if (fishBobber) ringAt(fishBobber.x, fishBobber.y);
      say = "小鱼要来咬钩了。出现“！”，就快点一下。";
    } else if (fishPhase === "nibble") {
      ringAt(fishBobber.x, fishBobber.y);
      say = "快了！等“！”出来，再点。";
    } else if (fishPhase === "bite") {
      say = "现在！快点一下水面！";
    } else if (fishPhase === "reel") {
      clearHintRing();
      var bar = fishEl("reel-bar");
      if (bar) bar.classList.add("hinted");
      fishRing = { el: document.createElement("span"), follow: null, timer: setTimeout(clearHintRing, 3800) };
      say = "按住收线，小鱼往右跑。跑出绿色，就松一松手。";
    } else return;
    toast(say);
    speak(say);
  }

  function showFishStars() {
    var n = fishStarCount();
    var best = fishBestStars();
    if (n > best) { try { localStorage.setItem(FISH_STARS_KEY, String(n)); } catch (e) {} }
    renderFishHud();
    var old = fishEl("fish-stars-card");
    if (old) old.remove();
    var line = "红" + withRuby("鲤鱼") + " " + fishCaught.red + " 条，金鱼 " + fishCaught.gold + " 条。";
    if (fishBonus) line += "还钓到了金色大" + withRuby("鲤鱼") + "！";
    line += n === 3 ? "真是钓鱼小能手！" : "下次少跑掉几条，星星会更多哦。";
    var card = document.createElement("div");
    card.id = "fish-stars-card";
    card.className = "fish-stars-card";
    card.innerHTML = '<div class="fsc-box"><h2>钓鱼大丰收！</h2>' +
      '<div class="fsc-stars">' + fishStarsHtml(n) + "</div>" +
      "<p>" + line + "</p>" +
      (n > best && best ? '<p class="fsc-best">比上次更棒啦！</p>' : "") +
      '<button type="button" class="btn-main" id="btn-fish-stars-ok">好的</button></div>';
    fishEl("screen-maze").appendChild(card);
    fishEl("btn-fish-stars-ok").onclick = function () {
      card.remove();
      finishMazeLevel();
    };
  }

  function bindFishControls() {
    var pond = fishEl("fish-pond");
    var reelBtn = fishEl("btn-reel");
    var up = function () { fishHolding = false; reelBtn.classList.remove("down"); };
    var down = function (e) {
      if (e.cancelable) e.preventDefault();
      if (fishPhase === "reel") { fishHolding = true; reelBtn.classList.add("down"); }
    };
    if (window.PointerEvent) {
      pond.addEventListener("pointerdown", onPondDown);
      reelBtn.addEventListener("pointerdown", down);
      ["pointerup", "pointercancel"].forEach(function (ev) { document.addEventListener(ev, up); });
    } else {
      pond.addEventListener("touchstart", onPondDown, { passive: false });
      pond.addEventListener("mousedown", onPondDown);
      reelBtn.addEventListener("touchstart", down, { passive: false });
      reelBtn.addEventListener("mousedown", down);
      ["touchend", "touchcancel", "mouseup"].forEach(function (ev) { document.addEventListener(ev, up); });
    }
    reelBtn.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    document.addEventListener("keydown", function (e) {
      if (!fishActive() || e.repeat) return;
      if (e.key === " " || e.key === "Enter") {
        if (fishPhase === "reel") { fishHolding = true; e.preventDefault(); }
        else if (fishPhase === "bite") { hookFish(); e.preventDefault(); }
      }
    });
    document.addEventListener("keyup", function (e) { if (e.key === " " || e.key === "Enter") fishHolding = false; });
    fishEl("btn-maze-hint").addEventListener("click", showFishHint);
  }

  function finishMazeLevel() {
    stopFishing();
    var first = !state.completed.maze;
    state.completed.maze = true;
    state.chapters.maze = true;
    state.clues.box = true;
    saveState();
    playStory(STORY.mazeAfter, function () {
      afterLevelReward(first || !state.cards.baoyu, ["baoyu"], "获得人物卡", "你认识了贾宝玉。还钓起了空盒子，和一张小纸片。", function () {
        goToMap(first ? "小纸片指向诗社。去问问探春和宝钗吧。" : "");
      });
    }, { title: "空空的玉盒", returnScreen: "screen-map" });
  }

  /* ===== Poetry ===== */
  function startPoetryLevel() {
    playStory(STORY.poetryBefore, function () {
      showScreen("screen-poetry");
      setupMatch("poem");
    }, { title: "诗社", returnScreen: "screen-map" });
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i];
      a[i] = a[j];
      a[j] = t;
    }
    return a;
  }

  function setupMatch(kind) {
    var pairs, leftHtml, rightHtml, tag, title;
    if (kind === "poem") {
      pairs = POEM_PAIRS.map(function (p, i) {
        return { id: "p" + i, left: p.left, right: p.right };
      });
      leftHtml = function (p) { return p.left; };
      rightHtml = function (p) { return p.right; };
      tag = "第一关 · 把诗句连起来";
      title = "诗社 · 对诗";
    } else {
      pairs = FLOWER_PAIRS.map(function (p) {
        return { id: p.id, left: p.left, right: p.right };
      });
      leftHtml = function (p) {
        return '<div class="flower-art">' + flowerSvg(p.left) + "</div>";
      };
      rightHtml = function (p) { return p.right; };
      tag = "第二关 · 认花名";
      title = "诗社 · 认花名";
    }
    document.getElementById("poetry-stage-tag").textContent = tag;
    document.getElementById("poetry-title").textContent = title;

    matchState = { kind: kind, pairs: pairs, selectedLeft: null, selectedRight: null, solved: {} };
    var area = document.getElementById("match-area");
    area.innerHTML = "";
    var leftCol = document.createElement("div");
    leftCol.className = "match-col";
    var rightCol = document.createElement("div");
    rightCol.className = "match-col";
    shuffle(pairs).forEach(function (p) {
      leftCol.appendChild(makeMatchCard("left", p.id, leftHtml(p)));
    });
    shuffle(pairs).forEach(function (p) {
      rightCol.appendChild(makeMatchCard("right", p.id, rightHtml(p)));
    });
    area.appendChild(leftCol);
    area.appendChild(rightCol);
  }

  function makeMatchCard(side, id, html) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "match-card";
    btn.dataset.side = side;
    btn.dataset.id = id;
    btn.innerHTML = html;
    btn.addEventListener("click", function () { onMatchTap(btn); });
    return btn;
  }

  function clearMatchSelection() {
    var cards = document.querySelectorAll(".match-card.selected");
    for (var i = 0; i < cards.length; i++) cards[i].classList.remove("selected");
    matchState.selectedLeft = null;
    matchState.selectedRight = null;
  }

  function onMatchTap(btn) {
    if (!matchState || btn.classList.contains("correct")) return;
    var side = btn.dataset.side;
    var id = btn.dataset.id;
    var cards = document.querySelectorAll('.match-card[data-side="' + side + '"]');
    for (var i = 0; i < cards.length; i++) {
      if (!cards[i].classList.contains("correct")) cards[i].classList.remove("selected");
    }
    btn.classList.add("selected");
    if (side === "left") matchState.selectedLeft = id;
    else matchState.selectedRight = id;

    if (matchState.selectedLeft && matchState.selectedRight) {
      if (matchState.selectedLeft === matchState.selectedRight) {
        markCorrect(matchState.selectedLeft);
        chime("ok");
        matchState.solved[matchState.selectedLeft] = true;
        clearMatchSelection();
        if (Object.keys(matchState.solved).length === matchState.pairs.length) {
          setTimeout(onMatchStageDone, 450);
        }
      } else {
        chime("bad");
        var left = document.querySelector('.match-card[data-side="left"][data-id="' + matchState.selectedLeft + '"]');
        var right = document.querySelector('.match-card[data-side="right"][data-id="' + matchState.selectedRight + '"]');
        [left, right].forEach(function (el) {
          if (!el) return;
          el.classList.add("wrong");
          setTimeout(function () { el.classList.remove("wrong"); }, 400);
        });
        clearMatchSelection();
        toast("差一点点，再试试～");
      }
    }
  }

  function markCorrect(id) {
    var cards = document.querySelectorAll('.match-card[data-id="' + id + '"]');
    for (var i = 0; i < cards.length; i++) {
      cards[i].classList.add("correct");
      cards[i].classList.remove("selected");
    }
  }

  function onMatchStageDone() {
    if (matchState.kind === "poem") {
      playStory(STORY.poetryMid, function () {
        showScreen("screen-poetry");
        setupMatch("flower");
      }, { title: "诗社", returnScreen: "screen-map" });
    } else {
      finishPoetryLevel();
    }
  }

  function finishPoetryLevel() {
    var first = !state.completed.poetry;
    state.completed.poetry = true;
    state.chapters.poetry = true;
    state.clues.chick = true;
    saveState();
    playStory(STORY.poetryAfter, function () {
      afterLevelReward(first || !state.cards.tanchun || !state.cards.baochai, ["tanchun", "baochai"], "获得两张人物卡", "你认识了贾探春和薛宝钗。小鸡的发现，指向稻香村。", function () {
        goToMap(first ? "去稻香村，帮帮刘姥姥吧。" : "");
      });
    }, { title: "小纸片上的发现", returnScreen: "screen-map" });
  }

  /* ===== Granny level ===== */
  function startGrannyLevel() {
    playStory(STORY.grannyBefore, function () {
      showScreen("screen-granny");
      setupGrannyStage(1);
    }, { title: "刘姥姥游园", returnScreen: "screen-map" });
  }

  function setupGrannyStage(n) {
    clearTimeout(chickenTimer);
    grannyStage = n;
    var root = document.getElementById("granny-stage");
    var tag = document.getElementById("granny-stage-tag");
    var title = document.getElementById("granny-title");
    if (n === 1) {
      setRich(title, "稻香村 · 指路");
      tag.textContent = "第一关 · 给刘姥姥指路";
      root.innerHTML = '<p class="granny-help">刘姥姥记得：先过石桥，再过花亭，最后到菜园。</p>' +
        '<div class="path-row" id="path-row"></div>' +
        '<div class="land-grid">' +
        '<button type="button" class="land-btn" data-land="bridge"><span class="ico">' + iconBridge() + "</span>石桥</button>" +
        '<button type="button" class="land-btn" data-land="pavilion"><span class="ico">🌸</span>花亭</button>' +
        '<button type="button" class="land-btn" data-land="pond"><span class="ico">🪷</span>荷塘</button>' +
        '<button type="button" class="land-btn" data-land="garden"><span class="ico">🥬</span>菜园</button>' +
        "</div>";
      window._grannyPath = [];
      renderPathRow();
      root.querySelectorAll(".land-btn").forEach(function (btn) {
        btn.addEventListener("click", function () { onLandTap(btn.dataset.land); });
      });
    } else if (n === 2) {
      setRich(title, "稻香村 · 捉鸡");
      tag.textContent = "第二关 · 捉住那只小鸡";
      chickenCaught = 0;
      root.innerHTML = '<p class="granny-help" id="chicken-help">点那只跑来跑去的小鸡。捉住 3 次就好。</p>' +
        '<div class="yard" id="chicken-yard"><button type="button" class="chicken" id="chicken-btn" aria-label="小鸡">🐔</button></div>';
      document.getElementById("chicken-btn").addEventListener("click", catchChicken);
      moveChicken(true);
      armChickenMove();
    } else {
      setRich(title, "稻香村 · 鸽子蛋");
      tag.textContent = "第三关 · 用筷子夹起鸽子蛋";
      eggsGot = 0;
      eggSlipped = false;
      root.innerHTML = '<p class="granny-help" id="egg-help">点一颗鸽子蛋。它就会被夹起来。一共要夹 5 颗。</p>' +
        '<div class="egg-table" id="egg-table">' +
        '<div class="bowl"><div class="bowl-art">🥣</div><div class="bowl-count" id="bowl-count">0 / 5</div></div>' +
        "</div>";
      var spots = [
        { x: 18, y: 42 }, { x: 38, y: 70 }, { x: 58, y: 48 },
        { x: 78, y: 72 }, { x: 70, y: 38 }
      ];
      var table = document.getElementById("egg-table");
      spots.forEach(function (s, i) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "pigeon-egg";
        b.style.left = s.x + "%";
        b.style.top = s.y + "%";
        b.setAttribute("aria-label", "鸽子蛋");
        b.innerHTML = '<span class="egg-shape"></span>';
        b.addEventListener("click", function () { pickEgg(b, i); });
        table.appendChild(b);
      });
    }
  }

  function renderPathRow() {
    var steps = ["起点", "石桥", "花亭", "菜园"];
    var html = "";
    var got = window._grannyPath || [];
    var names = { bridge: "石桥", pavilion: "花亭", garden: "菜园" };
    var done = got.map(function (k) { return names[k]; });
    for (var i = 0; i < steps.length; i++) {
      if (i) html += " → ";
      var on = i === 0 || done.indexOf(steps[i]) !== -1;
      html += '<span class="path-node' + (on ? " on" : "") + '">' + steps[i] + "</span>";
    }
    document.getElementById("path-row").innerHTML = html;
  }

  function onLandTap(land) {
    var need = ["bridge", "pavilion", "garden"];
    var got = window._grannyPath || [];
    var next = need[got.length];
    if (land === "pond") {
      chime("bad");
      toast("哎哟！这边是荷塘，鞋要湿啦！");
      speak("哎哟，这边是荷塘，鞋要湿啦。");
      return;
    }
    if (land !== next) {
      chime("bad");
      toast("咦，还没走到这里。我们按顺序走吧。");
      speak("咦，还没走到这里。我们按顺序走吧。");
      return;
    }
    got.push(land);
    window._grannyPath = got;
    chime("ok");
    renderPathRow();
    if (got.length === 3) {
      showDialog("granny", "走对了！石桥、花亭、菜园，这回我认得了。快看，那只小鸡在菜园里跑呢！", function () {
        showScreen("screen-granny");
        setupGrannyStage(2);
      });
    }
  }

  function moveChicken(instant) {
    var btn = document.getElementById("chicken-btn");
    var yard = document.getElementById("chicken-yard");
    if (!btn || !yard) return;
    if (instant) btn.style.transition = "none";
    btn.style.left = 18 + Math.random() * 64 + "%";
    btn.style.top = 18 + Math.random() * 64 + "%";
    if (instant) {
      void btn.offsetWidth;
      btn.style.transition = "";
    }
  }

  function armChickenMove() {
    clearTimeout(chickenTimer);
    chickenTimer = setTimeout(function () {
      moveChicken(false);
      armChickenMove();
    }, 1100);
  }

  function catchChicken() {
    chickenCaught += 1;
    chime("ok");
    var help = document.getElementById("chicken-help");
    if (chickenCaught >= 3) {
      clearTimeout(chickenTimer);
      if (help) help.textContent = "捉住啦！3 / 3";
      showDialog("granny", "这鸡跑得真快，还好有你！哟，我一着急，把鸽子蛋碰翻了。", function () {
        showScreen("screen-granny");
        setupGrannyStage(3);
      });
    } else {
      if (help) help.textContent = "还差一点点，再捉 " + (3 - chickenCaught) + " 次。已捉住 " + chickenCaught + " / 3";
      toast("差点儿跑了！再点一次～");
      moveChicken(false);
    }
  }

  function pickEgg(btn, idx) {
    if (btn.classList.contains("gone")) return;
    if (!eggSlipped && idx === 2) {
      eggSlipped = true;
      chime("bad");
      btn.style.left = "50%";
      btn.style.top = "80%";
      toast("这蛋比我还滑！再夹一次。");
      speak("这蛋比我还滑，再夹一次。");
      return;
    }
    btn.classList.add("gone");
    btn.style.transform = "translate(-50%, -180%)";
    eggsGot += 1;
    chime("ok");
    document.getElementById("bowl-count").textContent = eggsGot + " / 5";
    if (eggsGot >= 5) {
      setTimeout(finishGrannyLevel, 400);
    }
  }

  function finishGrannyLevel() {
    clearTimeout(chickenTimer);
    var first = !state.completed.granny;
    state.completed.granny = true;
    state.chapters.granny = true;
    state.clues.basket = true;
    saveState();
    playStory(STORY.grannyAfter, function () {
      afterLevelReward(first || !state.cards.granny, ["granny"], "获得人物卡", "你认识了刘姥姥。最后一条发现，指向贾母奶奶的花篮。", function () {
        goToMap("发现都齐了。去会芳园找贾母奶奶吧。");
      });
    }, { title: "花篮在哪", returnScreen: "screen-map" });
  }

  /* ===== Finale ===== */
  function startFinale() {
    if (!isUnlocked("finale")) {
      toast("先把四个发现找齐，再去会芳园。");
      return;
    }
    playStory(STORY.finaleBefore, function () {
      showFinalePuzzle();
    }, { title: "会芳园", returnScreen: "screen-map" });
  }

  function showFinalePuzzle() {
    finaleLit = {};
    showScreen("screen-finale");
    setRich("finale-help", "把四个发现都点亮。看看花篮里有什么。");
    var grid = document.getElementById("finale-clues");
    grid.innerHTML = "";
    var basket = document.getElementById("btn-basket");
    basket.className = "basket-btn";
    basket.innerHTML = "🧺<span>点开贾母奶奶的花篮</span>";
    CLUES.forEach(function (c) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "clue-card";
      btn.innerHTML = '<span class="ico">' + c.ico + "</span><strong>" + c.name + "</strong><div>" + c.desc + "</div>";
      btn.addEventListener("click", function () {
        finaleLit[c.id] = true;
        btn.classList.add("on");
        chime("ok");
        speak(c.name + "。" + c.desc);
        if (CLUES.every(function (x) { return finaleLit[x.id]; })) {
          setRich("finale-help", "四个发现都指向同一个地方。花篮亮起来了！");
          basket.classList.add("show");
          speak("四个发现都指向同一个地方。花篮亮起来了。");
        }
      });
      grid.appendChild(btn);
    });
  }

  function openBasket() {
    var basket = document.getElementById("btn-basket");
    if (basket.classList.contains("found")) return;
    basket.classList.add("found");
    basket.innerHTML = jadeFoundSvg() + "<span>" + withRuby("通灵宝玉找到啦！") + "</span>";
    chime("win");
    state.clues.basket = true;
    var first = !state.completed.finale;
    state.completed.finale = true;
    state.chapters.finale = true;
    saveState();
    setTimeout(function () {
      playStory(STORY.finaleAfter, function () {
        afterLevelReward(first || !state.cards.jiamu, ["jiamu"], "获得人物卡", "你认识了贾母奶奶。宝贝玉回家了。", function () {
          showEnding();
        });
      }, { title: "看花灯晚会", returnScreen: "screen-map" });
    }, 700);
  }

  /* ===== Name / intro ===== */
  function openNameScreen() {
    showScreen("screen-name");
    document.getElementById("name-art").innerHTML = chibiSvg("jiamu");
    var chips = document.getElementById("name-chips");
    chips.innerHTML = "";
    ["小梅", "小竹", "小荷", "小桂", "小桐"].forEach(function (n) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "name-chip" + (state.playerName === n ? " on" : "");
      b.textContent = n;
      b.addEventListener("click", function () {
        document.getElementById("name-input").value = n;
        var all = chips.querySelectorAll(".name-chip");
        for (var i = 0; i < all.length; i++) all[i].classList.toggle("on", all[i].textContent === n);
      });
      chips.appendChild(b);
    });
    if (state.playerName) document.getElementById("name-input").value = state.playerName;
    speak("孩子，告诉贾母奶奶，你叫什么名字呀？");
  }

  function confirmName() {
    var name = (document.getElementById("name-input").value || "").trim();
    name = name.replace(/\s+/g, "").slice(0, 6);
    if (!name) {
      toast("先告诉贾母奶奶你的名字吧。");
      speak("先告诉贾母奶奶你的名字吧。");
      return;
    }
    state.playerName = name;
    saveState();
    playStory(STORY.intro, function () {
      state.introDone = true;
      state.chapters.intro = true;
      var first = !state.cards.feng;
      state.cards.feng = true;
      saveState();
      afterLevelReward(first, ["feng"], "获得人物卡", "你认识了凤姐姐。先去潇湘馆，帮帮林妹妹吧。", function () {
        goToMap("先去潇湘馆，帮帮林妹妹吧。");
      });
    }, { title: "初到贾家", returnScreen: "screen-name", allowBack: true });
  }

  function onStartClick() {
    getAudio();
    if (!state.playerName || !state.introDone) {
      openNameScreen();
      return;
    }
    showScreen("screen-map");
    updateMap();
    speak(fillName("欢迎回来，{name}。大观园还在等你。"));
  }

  /* ===== Title petals ===== */
  function spawnTitlePetals() {
    var box = document.getElementById("title-petals");
    box.innerHTML = "";
    var colors = ["#f2a0b4", "#f8d4e0", "#f4c14e", "#ee8a9a"];
    for (var i = 0; i < 16; i++) {
      var p = document.createElement("div");
      p.className = "petal-fall";
      p.style.left = Math.random() * 100 + "%";
      p.style.background = colors[i % colors.length];
      p.style.animationDuration = 7 + Math.random() * 6 + "s";
      p.style.animationDelay = Math.random() * 6 + "s";
      p.style.width = 12 + Math.random() * 10 + "px";
      box.appendChild(p);
    }
  }

  /* ===== Init ===== */
  function leaveLevel() {
    clearTimeout(petalHintTimer);
    stopFishing();
    stopFlowerWind();
    clearTimeout(chickenTimer);
    stopSpeak();
    showScreen("screen-map");
    updateMap();
  }

  function resetGame() {
    if (!window.confirm("真的要重新开始吗？人物卡和故事会先收起来。")) return;
    var speechOn = state.speech;
    state = emptyState();
    state.speech = speechOn;
    saveState();
    renderCollection();
    updateMap();
    toast("已经重新开始啦。");
    showScreen("screen-title");
  }

  document.getElementById("btn-start").addEventListener("click", onStartClick);
  document.getElementById("btn-speech").addEventListener("click", function () { onSpeakerTap(true); });
  document.getElementById("btn-map-speech").addEventListener("click", toggleSpeech);
  document.getElementById("btn-name-speech").addEventListener("click", toggleSpeech);
  document.getElementById("btn-story-speech").addEventListener("click", toggleSpeech);
  document.getElementById("btn-map-home").addEventListener("click", function () {
    stopSpeak();
    showScreen("screen-title");
  });
  document.getElementById("btn-collection").addEventListener("click", function () {
    renderCollection();
    showScreen("screen-collection");
  });
  document.getElementById("btn-col-back").addEventListener("click", function () {
    showScreen("screen-map");
    updateMap();
  });
  document.getElementById("btn-book").addEventListener("click", function () {
    renderBook();
    showScreen("screen-book");
  });
  document.getElementById("btn-book-back").addEventListener("click", function () {
    showScreen("screen-map");
    updateMap();
  });
  document.getElementById("btn-reset").addEventListener("click", resetGame);
  document.getElementById("btn-ending").addEventListener("click", function () {
    if (state.completed.finale) showEnding();
    else startFinale();
  });
  document.getElementById("btn-end-ok").addEventListener("click", function () {
    document.getElementById("overlay-end").classList.remove("active");
    stopSpeak();
  });
  document.getElementById("btn-dialog-ok").addEventListener("click", hideDialog);
  document.getElementById("btn-name-back").addEventListener("click", function () {
    stopSpeak();
    showScreen("screen-title");
  });
  document.getElementById("btn-name-ok").addEventListener("click", confirmName);
  document.getElementById("name-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter") confirmName();
  });
  document.getElementById("story-advance").addEventListener("click", advanceStory);
  document.getElementById("story-scene").addEventListener("click", advanceStory);
  document.getElementById("btn-story-back").addEventListener("click", leaveStory);
  document.getElementById("btn-finale-back").addEventListener("click", leaveLevel);
  document.getElementById("btn-basket").addEventListener("click", openBasket);

  document.getElementById("btn-flowers-back").addEventListener("click", leaveLevel);
  document.getElementById("btn-maze-back").addEventListener("click", leaveLevel);
  document.getElementById("btn-poetry-back").addEventListener("click", leaveLevel);
  document.getElementById("btn-granny-back").addEventListener("click", leaveLevel);
  document.getElementById("btn-petal-hint").addEventListener("click", function () { showPetalHint(false); });

  bindFishControls();

  document.querySelectorAll(".spot-btn").forEach(function (btn) {
    btn.addEventListener("click", function () { enterLevel(btn.dataset.level); });
  });

  if (ttsOK) {
    try {
      if (speechSynthesis.addEventListener) speechSynthesis.addEventListener("voiceschanged", refreshVoice);
      else speechSynthesis.onvoiceschanged = refreshVoice;
    } catch (e) {}
    refreshVoice();
    ["touchend", "pointerup", "click", "keydown"].forEach(function (ev) {
      document.addEventListener(ev, unlockSpeech, { capture: true, passive: true });
    });
  }

  spawnTitlePetals();
  updateSpeechUI();
  updateMap();
})();
  </script>
</body>
</html>
